        #   subagentProvider: spawn
        #   toolName: council
        #   maxAgentsPerLayer: 12
        #   maxLayers: 6
        #   maxFindings: 200
        #   maxFindingChars: 2000
        #   maxReportChars: 32768
        #   defaultPreset: bug-hunt
        #   presets: []        # replaces the four shipped topologies wholesale
